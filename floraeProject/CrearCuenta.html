<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="CrearCuenta.css">
</head>
<body>
      <div class="contenedor">

    <div class="header">
      <img src="imagenes/logo.png">
      <span>Florae</span>
    </div>

    <div class="icono-top">
      <img src="/imagenes/Regadera.png">
    </div>

    <h2>Crear cuenta</h2>
    <p class="sub">¿Listo para empezar? Crea tu cuenta ahora</p>

    <form action="Inicio.html">

      <div class="input-box">
        <img src="imagenes/Usuario.png">
        <input type="text" placeholder="Nombre completo" required>
      </div>

      <div class="input-box">
        <img src="imagenes/Usuario.png">
        <input type="email" placeholder="Correo electronico" required>
        <img src="imagenes/Candado.png" class="ver">
      </div>

      <div class="input-box">
        <img src="imagenes/Candado.png">
        <input type="password" placeholder="Contraseña" required>
      </div>

      <label class="check">
        <input type="checkbox" required>
        <span>Acepto los términos y condiciones</span>
      </label>

      <button type="submit" class="btn">Crear cuenta</button>

    </form>

    <p class="login">
      ¿Ya tienes cuenta? <a href="InicioSesion.html">Inicia sesion</a>
    </p>

  </div>
</body>
</html>
