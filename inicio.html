<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/Inicio.css" />
    <title>Document</title>
  </head>
  <body>
<!-- NAVBAR -->
  <nav class="navbar">
    <img src="imagenes/logo.png" class="logo">

    <ul>
      <li><a href="#" class="activo">Inicio</a></li>
      <li><a href="#">Plantas</a></li>
      <li><a href="#">Cuidados</a></li>
    </ul>

    <div class="acciones">
      <a href="#" class="btn">Registrarse</a>
      <a href="#" class="btn">Inicio sesión</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="texto">
      <h1>Conocimiento que hace crecer tus plantas.</h1>
      <p>
        Gestiona tus especies, recibe alertas de cuidado y diagnostica
        problemas en un solo lugar.
      </p>

      <form class="buscador">
        <label>¿Qué planta tienes en tu casa?</label>
        <div class="input-group">
          <input type="text" placeholder="Suculenta, Margarita...">
          <button type="submit"></button>
        </div>
      </form>
    </div>

    <div class="imagen">
      <img src="imagenes/plantas.png">
    </div>
  </section>

  <!-- ICONOS -->
  <section class="iconos">
    <div class="icono">
      <img src="imagenes/IconoHoja.png">
    </div>
    <div class="icono">
      <img src="imagenes/IconoSol.png">
    </div>
    <div class="icono">
      <img src="imagenes/IconoRegadera.png">
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <img src="imagenes/logo.png">
  </footer>
  </body>
</html>
